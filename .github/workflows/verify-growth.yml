name: Growth Agent Production Verification

on:
  push:
    branches:
      - codex/growth-agent

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Backfill eight completed JST days and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROWTH_GITHUB_TOKEN: ${{ secrets.GROWTH_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_OUTPUT_TOKENS: "1200"
        run: |
          for days_ago in $(seq 8 -1 1); do
            report_date="$(TZ=Asia/Tokyo date -d "$days_ago days ago" +%F)"
            python -m growth_agent.main --date "$report_date"
          done
          cat growth-output/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: growth-verification-report-${{ github.run_id }}
          path: growth-output/
          retention-days: 90

      - name: Upload verification history
        uses: actions/upload-artifact@v4
        with:
          name: growth-verification-history-${{ github.run_id }}
          path: growth-history/
          retention-days: 90
